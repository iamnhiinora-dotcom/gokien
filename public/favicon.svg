  <!-- Tree branch segment -->
  <path d="M12 8 L12 56" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <circle cx="12" cy="32" r="2.5" fill="#dc2626" />
  
  <!-- Woodpecker Gõ -->
  <!-- Pencil Red Crest -->
  <path d="M30 14 C26 10, 20 12, 18 16 C22 17, 26 19, 29 22 Z" fill="#dc2626" />
  
  <!-- Head & Body (Ink Navy) -->
  <path d="M26 18 C32 18, 38 22, 38 30 C38 38, 34 46, 28 50 C26 51, 24 50, 24 47 C24 43, 26 38, 26 32 C26 26, 24 22, 26 18 Z" fill="#16233b" />
  
  <!-- Highlighter Yellow Wing / Cheek Accent -->
