<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#09142e" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />
  <rect x="20" y="20" width="1160" height="590" rx="28" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Badge Top -->
  <g transform="translate(100, 90)">
    <rect width="360" height="42" rx="21" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5" />
    <text x="35" y="27" fill="#a5b4fc" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">✦ NỀN TẢNG TRANH BIỆN WSDC</text>
  </g>

  <!-- Brand Name -->
  <text x="100" y="220" fill="url(#textGrad)" font-family="'Be Vietnam Pro', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    TRÍ TUỆ PHẢN BIỆN
  </text>

  <!-- Subtitle -->
  <text x="100" y="280" fill="#f8fafc" font-family="'Be Vietnam Pro', sans-serif" font-size="32" font-weight="700">
    Đấu Trường Tranh Biện &amp; Rèn Luyện Tư Duy THPT
  </text>

  <!-- Description -->
  <text x="100" y="340" fill="#94a3b8" font-family="'Be Vietnam Pro', sans-serif" font-size="20" font-weight="400">
    Đối thoại giả lập AI theo chuẩn WSDC · Nhận diện 27 bẫy ngụy biện · Mô hình M-A-C-R-E
  </text>
  <text x="100" y="375" fill="#94a3b8" font-family="'Be Vietnam Pro', sans-serif" font-size="20" font-weight="400">
    Hệ thống Gamification: Tích lũy XP, thăng hạng danh vị &amp; thi đua Bảng xếp hạng FPT High School
  </text>

  <!-- Feature Cards Bottom -->
  <g transform="translate(100, 440)">
    <rect width="310" height="100" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="45" cy="50" r="22" fill="#1e293b" />
    <text x="37" y="58" font-size="22">🛡️</text>
    <text x="85" y="44" fill="#38bdf8" font-family="'Be Vietnam Pro', sans-serif" font-size="17" font-weight="700">Vạch Lá Tìm Sâu</text>
    <text x="85" y="70" fill="#64748b" font-family="'Be Vietnam Pro', sans-serif" font-size="14">Phát hiện bẫy ngụy biện</text>
  </g>

  <g transform="translate(445, 440)">
    <rect width="310" height="100" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="45" cy="50" r="22" fill="#1e293b" />
    <text x="37" y="58" font-size="22">⚔️</text>
    <text x="85" y="44" fill="#818cf8" font-family="'Be Vietnam Pro', sans-serif" font-size="17" font-weight="700">Đấu Trường Tranh Biện</text>
    <text x="85" y="70" fill="#64748b" font-family="'Be Vietnam Pro', sans-serif" font-size="14">Đối đầu AI chuẩn WSDC</text>
  </g>

  <g transform="translate(790, 440)">
    <rect width="310" height="100" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="45" cy="50" r="22" fill="#1e293b" />
    <text x="37" y="58" font-size="22">🏆</text>
    <text x="85" y="44" fill="url(#goldGrad)" font-family="'Be Vietnam Pro', sans-serif" font-size="17" font-weight="700">Bảng Vinh Quang</text>
    <text x="85" y="70" fill="#64748b" font-family="'Be Vietnam Pro', sans-serif" font-size="14">XP thời gian thực &amp; Huy hiệu</text>
  </g>
</svg>
